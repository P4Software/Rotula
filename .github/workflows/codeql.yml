name: CodeQL

# Static security analysis of the C# code. It only analyses: it builds the solution so CodeQL can see the compiled code, uploads
# the findings to the repository's code-scanning page and publishes or signs nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2" # Tuesdays, 03:41 UTC: new queries are noticed even when nobody pushes

# The default token is read-only; the analysis job asks for the one extra permission code scanning needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # A manual build, because the solution holds a WPF application, test projects and database packs, and the build is the same one the
          # Build workflow runs, so what is analysed is exactly what is shipped.
          build-mode: manual

      - name: Restore
        run: dotnet restore Rotula.sln

      # The whole solution is built exactly like the Build workflow does. UseSharedCompilation=false keeps the C# compiler in-process, which
      # is what lets CodeQL observe the compilation (a shared compiler server would hide it from the tracer).
      - name: Build
        run: dotnet build Rotula.sln -c Release --no-restore -p:UseSharedCompilation=false

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
