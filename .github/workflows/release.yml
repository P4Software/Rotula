name: Release

# Runs when a version tag such as v0.1.0 (or v0.2.0-rc1) is pushed.
# This workflow only verifies and builds: it never signs, never builds the installer and never creates or touches a
# GitHub Release. The signed installer and the Release are produced locally with the company's Azure login
# (packaging/installer/build-installer.cmd, see docs/releasing.md). CI holds no signing secrets by design.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read # nothing here writes to the repository or to Releases

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    name: Build, test and package (unsigned workflow artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hygiene check
        shell: bash
        run: bash scripts/check-hygiene.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version from the tag
        id: ver
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '${{ github.ref_name }}' is not a v<major>.<minor>.<patch>[-suffix] version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Rotula.sln

      - name: Build
        run: dotnet build Rotula.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test with coverage
        run: >
          dotnet test Rotula.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage/raw

      - name: Coverage gate (Rotula.Core >= 80% lines)
        shell: pwsh
        run: |
          $report = Get-ChildItem coverage/raw -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw 'No coverage report was produced.' }
          ./scripts/check-coverage.ps1 -Report $report.FullName -Package Rotula.Core -Threshold 80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Self-contained so users need no .NET install. Native SkiaSharp libraries are packed into the
      # single file and unpacked to a temp folder on first start (IncludeNativeLibrariesForSelfExtract).
      - name: Publish single-file win-x64
        run: >
          dotnet publish src/Rotula.App/Rotula.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      # The MCP server, published the same way. DebugType=none keeps the huge SkiaSharp symbol file out of the output.
      - name: Publish MCP server single-file win-x64
        run: >
          dotnet publish src/Rotula.Mcp/Rotula.Mcp.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64-mcp

      # The zip is an UNSIGNED CI artifact for inspection only; the signed portable zip comes from the local build.
      - name: Stage files and create the portable zip
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts, stage | Out-Null
          Copy-Item publish/win-x64/Rotula.App.exe, publish/win-x64-mcp/Rotula.Mcp.exe stage/
          New-Item -ItemType Directory -Force stage/docs | Out-Null
          Copy-Item docs/mcp.md stage/docs/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "artifacts/Rotula-$v-win-x64-portable-unsigned-ci.zip" -Force

      # Smoke test: the published exe must start and stay up (a missing native asset would crash it at once).
      - name: Smoke test the published exe
        shell: pwsh
        run: |
          $p = Start-Process publish/win-x64/Rotula.App.exe -PassThru
          Start-Sleep -Seconds 8
          $alive = -not $p.HasExited
          if ($alive) { $p.Kill() }
          if (-not $alive) { throw "Rotula.App.exe exited early with code $($p.ExitCode)." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-unsigned-ci
          path: artifacts/
